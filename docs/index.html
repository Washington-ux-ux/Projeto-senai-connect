<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Connect - Login</title>
    <link rel="stylesheet" href="./style/login-page.css">
    <link rel="shortcut icon" href="./assets/images/favicon.ico" type="image/x-icon">
</head>
<body>

    <div class="container">
        <div class="image-design">
            
        </div>

        <div class="login-forms">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" placeholder="Digite sua matrícula" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            <a href="./html/utils/forgot-password.html" class="forgot-password" id="forgot-password-link">Esqueceu a senha?</a>
            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <script src="./script/config.js"></script>
    <script src="./script/login-page.js"></script>
</body>
</html>
