<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Connect - Mudar Senha</title>
    <link rel="stylesheet" href="./style/login-page.css">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="shortcut icon" href="./assets/images/favicon.ico" type="image/x-icon">
    <script src="./script/theme-init.js"></script>
</head>
<body>

    <div class="container">
        <div class="banner">
            <div>
                <img src="./assets/images/Senai.png" alt="Logo do senai" class="img1">
            </div>

            <div>
                <img src="" alt="Logo do senai connect" id="connect-logo">
            </div>
            <script>
                const theme = localStorage.getItem("theme") || "light";
                const logoImg = document.getElementById("connect-logo");
                if (logoImg) {
                    logoImg.src = theme === "dark" ? "./assets/images/connectDark.png" : "./assets/images/senai-connect.png";
                }
            </script>

        </div>

        <nav>
            <ul>
                <div id="perfil-placeholder"></div>
                <li><a href="./inicio.html">Início</a></li>
                <li><a href="./eventos.html">Eventos</a></li>
                <li><a href="./mural.html">Mural de links</a></li>
                <li><a href="./sobre.html">Sobre</a></li>
                <i class="fa-solid fa-sun"></i>
                <i class="fa-solid fa-moon"></i>
                <div id="login-container"></div>
            </ul>
        </nav>
    </div>

    <div class="password-container">
        <div class="password-forms">
            <h2>Mudar Senha</h2>
            <p class="form-description">Digite sua senha atual e a nova senha para atualizar sua conta.</p>
            <form id="change-password-form">
                <div class="form-group">
                    <label for="current-password">Senha Atual</label>
                    <input type="password" id="current-password" placeholder="Digite sua senha atual" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Nova Senha</label>
                    <input type="password" id="new-password" placeholder="Digite a nova senha" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmar Nova Senha</label>
                    <input type="password" id="confirm-password" placeholder="Confirme a nova senha" required>
                </div>
                <button type="submit" class="btn-login">Mudar Senha</button>
            </form>
            <a href="./inicio.html" class="forgot-password">Cancelar</a>
            <div id="change-password-message" class="error-message"></div>
        </div>
    </div>

    <script src="./script/login.js"></script>
    <script src="./script/dayNightMode.js"></script>
    <script src="./script/profile.js"></script>
    <script src="./script/change-password.js"></script>
</body>
</html>
