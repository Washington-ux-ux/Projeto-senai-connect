<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Connect - Sobre</title>
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="./style/mural.css">
    <link rel="stylesheet" href="./style/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" href="./assets/images/favicon.ico" type="image/x-icon">
</head>
<body>

    <div class="container">

        <div class="banner">
            <div>
                <img src="./assets/images/Senai.png" alt="Logo do senai">
            </div>

            <div>
                <img src="./assets/images/senai-connect.png" alt="Logo do senai connect">
            </div>

        </div>
        
        <nav class="nav-mural">
            <ul>
                <div id="perfil-placeholder"></div>
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./eventos.html">Eventos</a></li>
                <li><a href="./mural.html">Mural</a></li>
                <li><a href="./sobre.html">Sobre</a></li>
                <i class="fa-solid fa-sun"></i>
                <i class="fa-solid fa-moon"></i>
                <div id="login-container"></div>
            </ul>
        </nav>

        
        <h1>Mural de Links</h1>
        <p>Bem-vindo ao Mural de Links do Senai Connect! Aqui você pode encontrar os links relacionados ao Senai.</p>
        
        <button id="btn-add-link" class="btn-add-link" style="display: none;">+ Adicionar Novo Link</button>

        <table id="links-table">
            <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Link</th>
                <th>Ações</th>
            </tr>
        </table>

        <div id="add-link-modal" class="modal-overlay">
            <div class="modal-box">
                <span id="btn-add-link-close" class="close-btn">&times;</span>
                <h2>Adicionar Novo Link</h2>
                <form id="add-link-form">
                    <div class="input-group">
                        <input type="text" id="link-name" placeholder="Nome do link" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="link-description" placeholder="Descrição" required>
                    </div>
                    <div class="input-group">
                        <input type="url" id="link-url" placeholder="URL do link" required>
                    </div>
                    <button type="submit" class="btn-submit">Adicionar</button>
                </form>
                <p id="add-link-error" class="error-message"></p>
            </div>
        </div>

        <div id="edit-link-modal" class="modal-overlay">
            <div class="modal-box">
                <span id="btn-edit-link-close" class="close-btn">&times;</span>
                <h2>Editar Link</h2>
                <form id="edit-link-form">
                    <input type="hidden" id="edit-link-id">
                    <div class="input-group">
                        <input type="text" id="edit-link-name" placeholder="Nome do link" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="edit-link-description" placeholder="Descrição" required>
                    </div>
                    <div class="input-group">
                        <input type="url" id="edit-link-url" placeholder="URL do link" required>
                    </div>
                    <button type="submit" class="btn-submit">Salvar</button>
                </form>
                <p id="edit-link-error" class="error-message"></p>
            </div>
        </div>





       

    </div>

    <script src="./script/login.js"></script>
    <script src="./script/dayNightMode.js"></script>
    <script src="./script/profile.js"></script>
    <script src="./script/mural.js"></script>
</body>
</html>
