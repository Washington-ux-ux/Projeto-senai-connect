<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Connect - Recuperar Senha</title>
    <link rel="stylesheet" href="../../style/login-page.css">
    <link rel="shortcut icon" href="../../assets/images/favicon.ico" type="image/x-icon">
</head>
<body>

    <div class="container">
        <div class="image-design">
            
        </div>

        <div class="login-forms">
            <h2>Mudar de senha</h2>
            <p class="form-description">Digite sua matrícula e a nova senha para mudar a senha da sua conta.</p>
            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" placeholder="Digite sua matrícula" required>
                </div>
                <div class="form-group">
                    <label for="new-password">Nova Senha</label>
                    <input type="password" id="new-password" placeholder="Digite a nova senha" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmar Nova Senha</label>
                    <input type="password" id="confirm-password" placeholder="Confirme a nova senha" required>
                </div>
                <button type="submit" class="btn-login">Mudar Senha</button>
            </form>
            <a href="../../index.html" class="forgot-password">Voltar ao Login</a>
            <div id="forgot-password-message" class="error-message"></div>
        </div>
    </div>

    <script src="../../script/config.js"></script>
    <script src="../../script/forgot-password.js"></script>
</body>
</html>
