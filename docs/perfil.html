<div class="profile-container" id="profileContainer">
    <div class="profile-icon" id="profileIcon" onclick="toggleMenu()">
        <i class="fa-regular fa-circle-user"></i>
    </div>

    <div class="profile-dropdown" id="profileMenu">
        <h3>Minhas Informações</h3>
        <div class="dropdown-divider"></div>
        
        <div class="info-group">
            <label><i class="fa-solid fa-user"></i> Nome</label>
            <input type="text" id="userName" readonly value="Carregando...">
        </div>
        <div class="info-group">
            <label><i class="fa-solid fa-id-badge"></i> Cargo</label>
            <input type="text" id="userRole" readonly value="Carregando...">
        </div>
        <div class="info-group">
            <label><i class="fa-solid fa-venus-mars"></i> Sexo</label>
            <input type="text" id="userSex" readonly value="Carregando...">
        </div>
        <div class="info-group">
            <label><i class="fa-solid fa-cake-candles"></i> Data de Nascimento</label>
            <input type="text" id="userBirth" readonly value="Carregando...">
        </div>
        <div class="info-group">
            <label><i class="fa-solid fa-graduation-cap"></i> Turma</label>
            <input type="text" id="userClass" readonly value="Carregando...">
        </div>
        <div class="info-group">
            <label><i class="fa-solid fa-calendar-plus"></i> Data de Criação</label>
            <input type="text" id="userCreatedAt" readonly value="Carregando...">
        </div>
    </div>
</div>
