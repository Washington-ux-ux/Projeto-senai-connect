services:
  - type: web
    name: projeto-senai-connect
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: senai-connect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: senai-connect-db
    plan: free
    databaseName: senai_connect
    user: senai_connect_user
